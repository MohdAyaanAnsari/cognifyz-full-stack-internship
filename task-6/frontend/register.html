<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Task 6</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>Create Account</h1>
      <p>Register to access the secure dashboard.</p>

      <form id="registerForm">

        <input
          type="text"
          id="name"
          placeholder="Full Name"
          required
        >

        <input
          type="email"
          id="email"
          placeholder="Email Address"
          required
        >

        <input
          type="password"
          id="password"
          placeholder="Password"
          required
        >

        <button type="submit">
          Register
        </button>

      </form>

      <p id="message"></p>

      <a href="login.html">
        Already have an account? Login
      </a>

    </div>
  </div>

  <script src="script.js"></script>

</body>
</html>
