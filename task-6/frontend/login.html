<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - Task 6</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <div class="card">

      <h1>Login</h1>

      <p>Login to access your data.</p>

      <form id="loginForm">

        <input
          type="email"
          id="loginEmail"
          placeholder="Email Address"
          required
        >

        <input
          type="password"
          id="loginPassword"
          placeholder="Password"
          required
        >

        <button type="submit">
          Login
        </button>

      </form>

      <p id="loginMessage"></p>

      <a href="register.html">
        Create a new account
      </a>

    </div>

  </div>

  <script src="script.js"></script>

</body>
</html>
